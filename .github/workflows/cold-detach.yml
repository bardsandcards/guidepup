name: Cold detach timing

# Fork-only experiment: times the first hdiutil detach on a fresh runner,
# with hdiutil alone and with a BSD umount first, and keeps DiskArbitration's log of it.

on:
  push:
    branches: [exp/cold-detach]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detach:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        mode: [plain, umount]
    steps:
      - run: sw_vers
      - name: Create a small APFS image
        run: hdiutil create -size 20m -fs APFS -volname ColdDetach "$RUNNER_TEMP/cold.dmg"
      - name: Attach and detach three times
        run: |
          /usr/bin/log stream --style compact --level debug --predicate 'process == "diskarbitrationd" OR process == "hdiutil"' > "$RUNNER_TEMP/da.log" 2>&1 &
          LP=$!; sleep 2
          MP=/Volumes/ColdDetach
          for i in 1 2 3; do
            dev=$(hdiutil attach "$RUNNER_TEMP/cold.dmg" -mountpoint $MP -shadow "$RUNNER_TEMP/cold.dmg.shadow" | head -1 | awk '{print $1}')
            t0=$(python3 -c 'import time;print(time.time())')
            if [ "${{ matrix.mode }}" = umount ]; then
              /sbin/umount $MP
              tu=$(python3 -c 'import time;print(time.time())')
              hdiutil detach "$dev" > /dev/null
            else
              hdiutil detach $MP > /dev/null
            fi
            t1=$(python3 -c 'import time;print(time.time())')
            [ -n "$tu" ] && python3 -c "print('RESULT umount $i: umount %.2fs' % ($tu-$t0))"
            python3 -c "print('RESULT ${{ matrix.mode }} detach $i: %.2fs' % ($t1-$t0))"
            rm -f "$RUNNER_TEMP/cold.dmg.shadow"
          done
          sleep 2; kill $LP
          echo "not responding: $(grep -c 'not responding' "$RUNNER_TEMP/da.log")"
          grep -E 'timed out session|not responding|unmounted disk' "$RUNNER_TEMP/da.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: da-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/da.log
