name: VoiceOver start timing

# Fork-only experiment: times guidepup's start() and stop() on the PR branch
# (first, while the runner is fresh) and then on main, on the same runner.

on:
  push:
    branches: [exp/cfprefsd-timing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: perf/voiceover-stop-detach
          path: pr
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: main
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: pr
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: main
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: pr
      - run: sw_vers
      - name: start() and stop() on the PR branch (fresh runner)
        run: node .github/voiceover-timing/start-cycles.js pr/lib pr 10
      - name: start() and stop() on main
        run: node .github/voiceover-timing/start-cycles.js main/lib main 10
      - if: failure()
        continue-on-error: true
        run: screencapture -x screen.png
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: screen-${{ matrix.os }}
          path: screen.png
