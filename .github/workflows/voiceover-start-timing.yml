name: VoiceOver start timing

# Fork-only experiment: times guidepup's start() and stop() on main and on the
# PR branch, each on its own fresh runner.

on:
  push:
    branches: [exp/cfprefsd-timing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        lib: [main, pr, img]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: perf/voiceover-umount-before-detach
          path: pr
      - uses: actions/checkout@v7
        with:
          ref: perf/voiceover-detach-by-image
          path: img
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: main
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: pr
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: img
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: main
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: pr
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: img
      - run: sw_vers
      - name: Images attached before any cycle
        run: hdiutil info | grep -E 'image-path|/dev/disk|/Volumes' || echo none
      - name: start() and stop() on a fresh runner
        run: |
          node .github/voiceover-timing/start-cycles.js ${{ matrix.lib }}/lib ${{ matrix.lib }} 5
          hdiutil info | grep -E 'image-path|/dev/disk|/Volumes' || echo none
          echo "LEAK images still attached: $(hdiutil info | grep -c guidepup-voiceover-preferences) mounted: $(mount | grep -c GuidepupVoiceOverPreferences)"
      - if: failure()
        continue-on-error: true
        run: screencapture -x screen.png
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: screen-${{ matrix.os }}
          path: screen.png
