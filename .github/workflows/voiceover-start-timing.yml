name: VoiceOver start timing

# Fork-only experiment: times VoiceOver launch paths, then guidepup's start()
# and stop() on main and on the PR branch, on the same runner.

on:
  push:
    branches: [exp/voiceover-cmdf5-start]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: perf/voiceover-start-macos-27
          path: pr
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: main
      - run: npm ci --no-audit --no-fund --no-progress && npm run build
        working-directory: pr
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: pr
      - run: sw_vers
      - name: Launch paths
        run: |
          if [ "$(uname -r | cut -d. -f1)" -ge 27 ]; then
            node .github/voiceover-timing/launch-paths.js 3 open cmdf5 jxa
          else
            node .github/voiceover-timing/launch-paths.js 3 starter open cmdf5 jxa
          fi
      - name: start() and stop() on main
        run: |
          echo "voiceOverOnOffKey before: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
          node .github/voiceover-timing/start-cycles.js main/lib main 10
          echo "voiceOverOnOffKey after main: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
      - name: start() and stop() on the PR branch
        run: |
          defaults write com.apple.universalaccess voiceOverOnOffKey -bool false || true
          echo "voiceOverOnOffKey before: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
          node .github/voiceover-timing/start-cycles.js pr/lib pr 10
          echo "voiceOverOnOffKey after pr: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
      - if: failure()
        continue-on-error: true
        run: screencapture -x screen.png
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: screen-${{ matrix.os }}
          path: screen.png
